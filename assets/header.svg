<svg width="920" height="340" viewBox="0 0 920 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Cormorant+Garamond:ital,wght@1,400;1,600&amp;family=Great+Vibes&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .cursive {
        font-family: 'Great Vibes', 'Brush Script MT', cursive;
      }
      .royal-italic {
        font-family: 'Cormorant Garamond', 'Georgia', serif;
        font-style: italic;
      }
      .monumental {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .glow-white {
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.4));
      }
      .glow-gold {
        filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.45));
      }
      .glow-cyan {
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
      }
    </style>

    <!-- Obsidian Void Gradients (Portfolio Style) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040609"/>
      <stop offset="45%" stop-color="#070B14"/>
      <stop offset="85%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Liquid Platinum / Pure White Text Gradient -->
    <linearGradient id="platinumTextGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Royal Gold Accent Gradient -->
    <linearGradient id="goldAccentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2B2"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Ambient Studio Spotlight & Sapphire Glows -->
    <radialGradient id="haloSpotlight" cx="240" cy="110" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#1E3A8A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="740" cy="170" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#8C6826" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Precision Gilded Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Cyber Background Matrix Grid -->
    <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base Obsidian Chassis -->
  <rect width="920" height="340" rx="14" fill="url(#bgGrad)"/>
  <rect width="920" height="340" rx="14" fill="url(#cyberGrid)"/>
  <rect width="920" height="340" rx="14" fill="url(#haloSpotlight)"/>
  <rect width="920" height="340" rx="14" fill="url(#goldGlow)"/>

  <!-- Top Specular Platinum Filament -->
  <line x1="40" y1="1.5" x2="880" y2="1.5" stroke="url(#goldAccentGrad)" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Outer Precision Borders -->
  <rect x="1.5" y="1.5" width="917" height="337" rx="13" stroke="url(#borderGrad)" stroke-width="1.2" fill="none"/>
  <rect x="7" y="7" width="906" height="326" rx="9" stroke="#1E293B" stroke-width="0.8" fill="none" stroke-opacity="0.6"/>

  <!-- Tactical Reticles & Corner Brackets -->
  <g stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.9">
    <path d="M 16 26 L 16 16 L 26 16"/>
    <path d="M 894 16 L 904 16 L 904 26"/>
    <path d="M 16 314 L 16 324 L 26 324"/>
    <path d="M 904 314 L 904 324 L 894 324"/>
  </g>

  <!-- TOP TELEMETRY STRIP -->
  <g class="mono" font-size="10.5">
    <!-- Academic Distinction Badge -->
    <rect x="28" y="22" width="310" height="24" rx="4" fill="#0D0E15" stroke="rgba(212, 175, 55, 0.35)" stroke-width="0.8"/>
    <circle cx="40" cy="34" r="3" fill="#D4AF37" class="glow-gold"/>
    <text x="50" y="38" fill="#FFF2B2" font-weight="600" letter-spacing="0.08em">SEC_AUDIT // KL UNIVERSITY 8.7 CGPA</text>

    <!-- Sys Ref (Cyber Blue) -->
    <text x="356" y="38" fill="#94A3B8" letter-spacing="0.06em">
      <tspan fill="#64748B">SYS_REF::</tspan><tspan fill="#38BDF8" font-weight="600">0x9E7D_VISAKA</tspan>
    </text>

    <!-- Coordinates -->
    <text x="690" y="38" fill="#94A3B8" letter-spacing="0.08em" text-anchor="end">
      <tspan fill="#D4AF37">LAT_ENC::</tspan>16.5062° N
    </text>
    <circle cx="704" cy="34" r="1.5" fill="#64748B"/>
    <text x="892" y="38" fill="#94A3B8" letter-spacing="0.08em" text-anchor="end">
      <tspan fill="#D4AF37">LON_ENC::</tspan>80.6480° E
    </text>
  </g>

  <!-- Thin Telemetry Divider -->
  <line x1="28" y1="56" x2="892" y2="56" stroke="#1E293B" stroke-width="0.8"/>

  <!-- HERO IDENTITY BLOCK (LEFT COLUMN - EXACT PORTFOLIO COLORING) -->
  <g transform="translate(28, 68)">
    <!-- Whisper-Thin Clearance Kicker -->
    <g transform="translate(2, 14)">
      <circle cx="5" cy="0" r="3" fill="#38BDF8" class="glow-cyan"/>
      <text x="16" y="4" class="mono" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.22em">
        OFFENSIVE CYBERSECURITY ARCHITECT
      </text>
    </g>

    <!-- Stacked Monolithic Headline: I'm VISAKA (Exact Portfolio Styling) -->
    <g transform="translate(2, 54)">
      <!-- Cursive "I" + Royal Italic "'m" -->
      <text x="0" y="0" class="cursive glow-white" font-size="44" fill="#FFFFFF">I</text>
      <text x="18" y="-6" class="royal-italic" font-size="28" fill="#94A3B8">'m</text>

      <!-- Giant Monolithic VISAKA in Cinzel -->
      <text x="62" y="2" class="monumental glow-white" font-size="48" font-weight="900" fill="url(#platinumTextGrad)" letter-spacing="0.06em">
        VISAKA
      </text>
    </g>

    <!-- Official Full Name in Royal Gold -->
    <g transform="translate(4, 88)">
      <text x="0" y="0" class="monumental" font-size="13" font-weight="700" fill="#D4AF37" letter-spacing="0.22em">
        VEERA GURU DATTA SRINIDHI VISAKA
      </text>
    </g>

    <!-- Subtitle & Role (Cyber Sky Blue) -->
    <g transform="translate(4, 110)">
      <text x="0" y="0" class="mono" font-size="11.5" font-weight="600" fill="#38BDF8" letter-spacing="0.1em">
        LEAD PENETRATION TESTER &amp; MULTI-CLOUD SPECIALIST
      </text>
    </g>

    <!-- Status Monospace Pill -->
    <g transform="translate(4, 126)">
      <rect x="0" y="0" width="464" height="24" rx="4" fill="#0D0E15" stroke="rgba(212, 175, 55, 0.3)" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3" fill="#10B981"/>
      <text x="24" y="16" class="mono" font-size="9.5" fill="#E2E8F0" letter-spacing="0.06em">
        <tspan fill="#10B981" font-weight="700">TIER-1 SOC READY</tspan> // ED25519 CRYPTOGRAPHICALLY VERIFIED
      </text>
    </g>

    <!-- Editorial Narrative Statement (From Portfolio) -->
    <g transform="translate(4, 172)" class="sans" font-size="11.5" fill="#94A3B8" letter-spacing="0.01em">
      <text x="0" y="0">Architecting resilient zero-trust enclaves &amp; executing preemptive adversarial simulations.</text>
      <text x="0" y="18">KL University BCA scholar (8.7 CGPA) with verified field engagements across Edufyi, Corizo &amp; Skill Dunia.</text>
    </g>

    <!-- Executive Action Pills (High Contrast Portfolio Style) -->
    <g transform="translate(4, 216)" class="mono" font-size="9.5">
      <!-- White High-Contrast Badge -->
      <rect x="0" y="0" width="112" height="22" rx="4" fill="#FFFFFF"/>
      <text x="56" y="15" fill="#000000" font-weight="700" text-anchor="middle">OWASP TOP 10</text>

      <!-- Royal Gold Pill -->
      <rect x="122" y="0" width="112" height="22" rx="4" fill="#0D0E15" stroke="#D4AF37" stroke-width="0.8"/>
      <text x="178" y="15" fill="#D4AF37" font-weight="600" text-anchor="middle">AVIATRIX ACE</text>

      <!-- Cyber Blue Pill -->
      <rect x="244" y="0" width="124" height="22" rx="4" fill="#0D0E15" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="306" y="15" fill="#38BDF8" font-weight="600" text-anchor="middle">BURP SUITE PRO</text>

      <!-- Emerald Pill -->
      <rect x="378" y="0" width="102" height="22" rx="4" fill="#0D0E15" stroke="#10B981" stroke-width="0.8"/>
      <text x="429" y="15" fill="#10B981" font-weight="600" text-anchor="middle">TATA CYBER</text>
    </g>
  </g>

  <!-- GPG CRYPTOGRAPHIC KEY BLOCK (RIGHT VITRINE CONTAINER - PORTFOLIO GILDED GLASS) -->
  <g transform="translate(560, 70)">
    <!-- Container Card -->
    <rect x="0" y="0" width="332" height="246" rx="8" fill="#0D0E15" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1"/>
    <!-- Gilded Corner Accent -->
    <path d="M 316 0 L 332 16 L 332 0 Z" fill="#D4AF37" fill-opacity="0.8"/>

    <!-- Key Block Header -->
    <rect x="0" y="0" width="332" height="32" rx="8" fill="#131520"/>
    <rect x="0" y="24" width="332" height="8" fill="#131520"/>
    <line x1="0" y1="32" x2="332" y2="32" stroke="rgba(212, 175, 55, 0.2)" stroke-width="0.8"/>

    <g class="mono" font-size="10.5">
      <circle cx="16" cy="16" r="3" fill="#D4AF37" class="glow-gold"/>
      <text x="28" y="20" fill="#FFF2B2" font-weight="700" letter-spacing="0.08em">GPG::KEY_BLOCK</text>
      <text x="316" y="20" fill="#38BDF8" text-anchor="end" font-weight="600">0x9E7D3B51</text>
    </g>

    <!-- Key Block Telemetry Content -->
    <g class="mono" font-size="9" fill="#94A3B8" transform="translate(14, 46)">
      <text x="0" y="10" fill="#64748B">-----BEGIN PGP SIGNED MESSAGE-----</text>
      <text x="0" y="26" fill="#D4AF37">Hash: SHA256 / Ed25519 Multi-Cloud</text>
      
      <rect x="0" y="34" width="304" height="42" rx="4" fill="#06070A" stroke="#1E293B" stroke-width="0.8"/>
      <text x="8" y="50" fill="#E2E8F0" font-size="8.5" letter-spacing="0.04em">F83B 1657 FF1F C53B 92DC 1814 8A1D 65DF</text>
      <text x="8" y="66" fill="#E2E8F0" font-size="8.5" letter-spacing="0.04em">C2D4 B1FA 3D67 7284 ADDD 2001 26D9 069A</text>

      <text x="0" y="94" fill="#64748B">UID: <tspan fill="#FFFFFF" font-weight="600">Veera Guru Datta Srinidhi Visaka</tspan></text>
      <text x="0" y="110" fill="#64748B">ROLES: <tspan fill="#D4AF37">Edufyi • Corizo • Skill Dunia</tspan></text>
      <text x="0" y="126" fill="#64748B">ENCLAVE: <tspan fill="#38BDF8">Vijayawada (AP, India)</tspan></text>

      <!-- Terminal Status Strip -->
      <line x1="0" y1="142" x2="304" y2="142" stroke="#1E293B" stroke-width="0.8"/>
      
      <text x="0" y="162" fill="#10B981" font-weight="700" font-size="10">STATE: VERIFIED</text>
      <text x="304" y="162" fill="#38BDF8" font-size="10" text-anchor="end" font-weight="600">SOC-TIER-1</text>
    </g>
  </g>
</svg>
