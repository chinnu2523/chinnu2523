<svg width="920" height="340" viewBox="0 0 920 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Great+Vibes&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .cursive {
        font-family: 'Great Vibes', 'Brush Script MT', cursive;
        font-style: italic;
      }
      .monumental {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
        letter-spacing: 0.1em;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .glow-gold {
        filter: drop-shadow(0 0 10px rgba(223, 183, 108, 0.45));
      }
      .glow-soft {
        filter: drop-shadow(0 0 8px rgba(223, 183, 108, 0.22));
      }
    </style>

    <!-- Obsidian Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020203"/>
      <stop offset="40%" stop-color="#08080B"/>
      <stop offset="80%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#010102"/>
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DFB76C"/>
      <stop offset="50%" stop-color="#FBD388"/>
      <stop offset="100%" stop-color="#DFB76C"/>
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#DFB76C"/>
    </linearGradient>

    <radialGradient id="goldBloom" cx="240" cy="120" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFB76C" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#9E7D3B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="keyBlockBloom" cx="740" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFB76C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFB76C" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#2A2A2E" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#DFB76C" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#2A2A2E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DFB76C" stop-opacity="0.85"/>
    </linearGradient>

    <pattern id="telemetryGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#26262B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Vitrine Chassis -->
  <rect width="920" height="340" rx="14" fill="url(#bgGrad)"/>
  <rect width="920" height="340" rx="14" fill="url(#telemetryGrid)"/>
  <rect width="920" height="340" rx="14" fill="url(#goldBloom)"/>
  <rect width="920" height="340" rx="14" fill="url(#keyBlockBloom)"/>

  <!-- Top Specular Accent Filament -->
  <line x1="40" y1="1.5" x2="880" y2="1.5" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- Outer Precision Borders -->
  <rect x="1.5" y="1.5" width="917" height="337" rx="13" stroke="url(#borderGrad)" stroke-width="1.2" fill="none"/>
  <rect x="7" y="7" width="906" height="326" rx="9" stroke="#26262B" stroke-width="0.8" fill="none" stroke-opacity="0.7"/>

  <!-- Tactical Reticles / Corner Brackets -->
  <g stroke="#DFB76C" stroke-width="1.5" stroke-opacity="0.9">
    <path d="M 16 26 L 16 16 L 26 16"/>
    <path d="M 894 16 L 904 16 L 904 26"/>
    <path d="M 16 314 L 16 324 L 26 324"/>
    <path d="M 904 314 L 904 324 L 894 324"/>
  </g>

  <!-- TOP TELEMETRY STRIP -->
  <g class="mono" font-size="10.5">
    <!-- Academic Distinction Badge -->
    <rect x="28" y="24" width="316" height="24" rx="4" fill="#0E0E11" stroke="#333338" stroke-width="0.8"/>
    <circle cx="40" cy="36" r="3" fill="#DFB76C" class="glow-soft"/>
    <text x="50" y="40" fill="#DFB76C" font-weight="600" letter-spacing="0.08em">SEC_AUDIT // KL UNIVERSITY 8.7 CGPA</text>

    <!-- Sys Ref -->
    <text x="360" y="40" fill="#94A3B8" letter-spacing="0.06em">
      <tspan fill="#64748B">SYS_REF::</tspan><tspan fill="#E2E8F0">0x9E7D_VISAKA</tspan>
    </text>

    <!-- Coordinates -->
    <text x="690" y="40" fill="#94A3B8" letter-spacing="0.08em" text-anchor="end">
      <tspan fill="#DFB76C">LAT_ENC::</tspan>16.5062° N
    </text>
    <circle cx="704" cy="36" r="1.5" fill="#64748B"/>
    <text x="892" y="40" fill="#94A3B8" letter-spacing="0.08em" text-anchor="end">
      <tspan fill="#DFB76C">LON_ENC::</tspan>80.6480° E
    </text>
  </g>

  <!-- Thin Telemetry Divider -->
  <line x1="28" y1="58" x2="892" y2="58" stroke="#26262B" stroke-width="0.8"/>

  <!-- HERO IDENTITY BLOCK (LEFT COLUMN) -->
  <g transform="translate(28, 70)">
    <!-- Cursive "I'm" -->
    <text x="4" y="28" class="cursive glow-soft" font-size="34" fill="#DFB76C">I'm</text>

    <!-- Monumental Serif Name: Line 1 -->
    <text x="2" y="66" class="monumental" font-size="24" font-weight="700" fill="#F1F5F9">
      VEERA GURU DATTA
    </text>

    <!-- Monumental Serif Name: Line 2 (Highlight) -->
    <text x="2" y="100" class="monumental glow-soft" font-size="30" font-weight="900" fill="#DFB76C">
      SRINIDHI VISAKA
    </text>

    <!-- Role Badge & Distinction -->
    <g transform="translate(4, 118)">
      <text x="0" y="12" class="sans" font-size="12" font-weight="600" fill="#DFB76C" letter-spacing="0.06em">
        LEAD PENETRATION TESTER &amp; MULTI-CLOUD SECURITY ARCHITECT
      </text>
    </g>

    <!-- Status Monospace Pill -->
    <g transform="translate(4, 142)">
      <rect x="0" y="0" width="460" height="24" rx="4" fill="#0A0A0E" stroke="#333338" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3" fill="#10B981"/>
      <text x="24" y="16" class="mono" font-size="9.5" fill="#E2E8F0" letter-spacing="0.06em">
        <tspan fill="#10B981">TIER-1 SOC READY</tspan> // ED25519 CRYPTOGRAPHICALLY VERIFIED
      </text>
    </g>

    <!-- Strategic Mission Statement -->
    <text x="4" y="190" class="sans" font-size="11.5" fill="#94A3B8" letter-spacing="0.02em">
      Architecting sovereign zero-trust mesh perimeters, multi-cloud transit encryption,
    </text>
    <text x="4" y="208" class="sans" font-size="11.5" fill="#94A3B8" letter-spacing="0.02em">
      and orchestrating offensive adversary emulation with zero-leakage security guarantees.
    </text>

    <!-- Micro Tags -->
    <g transform="translate(4, 226)" class="mono" font-size="9.5">
      <rect x="0" y="0" width="102" height="20" rx="3" fill="#131318" stroke="#26262B" stroke-width="0.8"/>
      <text x="51" y="14" fill="#DFB76C" text-anchor="middle">OWASP TOP 10</text>

      <rect x="110" y="0" width="112" height="20" rx="3" fill="#131318" stroke="#26262B" stroke-width="0.8"/>
      <text x="166" y="14" fill="#E2E8F0" text-anchor="middle">AVIATRIX ACE</text>

      <rect x="230" y="0" width="124" height="20" rx="3" fill="#131318" stroke="#26262B" stroke-width="0.8"/>
      <text x="292" y="14" fill="#DFB76C" text-anchor="middle">BURP SUITE PRO</text>

      <rect x="362" y="0" width="102" height="20" rx="3" fill="#131318" stroke="#26262B" stroke-width="0.8"/>
      <text x="413" y="14" fill="#10B981" text-anchor="middle">TATA CYBER</text>
    </g>
  </g>

  <!-- GPG CRYPTOGRAPHIC KEY BLOCK (RIGHT VITRINE CONTAINER) -->
  <g transform="translate(564, 72)">
    <!-- Container Card -->
    <rect x="0" y="0" width="328" height="244" rx="8" fill="#09090C" stroke="#333338" stroke-width="1"/>
    <!-- Chamfer / Accent Corner -->
    <path d="M 312 0 L 328 16 L 328 0 Z" fill="#DFB76C" fill-opacity="0.6"/>

    <!-- Key Block Header -->
    <rect x="0" y="0" width="328" height="32" rx="8" fill="#101015"/>
    <rect x="0" y="24" width="328" height="8" fill="#101015"/>
    <line x1="0" y1="32" x2="328" y2="32" stroke="#26262B" stroke-width="0.8"/>

    <g class="mono" font-size="10.5">
      <circle cx="16" cy="16" r="3" fill="#DFB76C" class="glow-soft"/>
      <text x="28" y="20" fill="#DFB76C" font-weight="700" letter-spacing="0.08em">GPG::KEY_BLOCK</text>
      <text x="312" y="20" fill="#94A3B8" text-anchor="end" font-weight="500">0x9E7D3B51</text>
    </g>

    <!-- Key Block Telemetry Content -->
    <g class="mono" font-size="9" fill="#94A3B8" transform="translate(14, 46)">
      <text x="0" y="10" fill="#64748B">-----BEGIN PGP SIGNED MESSAGE-----</text>
      <text x="0" y="26" fill="#DFB76C">Hash: SHA256 / Ed25519 Multi-Cloud</text>
      
      <rect x="0" y="34" width="300" height="42" rx="4" fill="#050507" stroke="#1F1F24" stroke-width="0.8"/>
      <text x="8" y="50" fill="#CBD5E1" font-size="8.5" letter-spacing="0.04em">F83B 1657 FF1F C53B 92DC 1814 8A1D 65DF</text>
      <text x="8" y="66" fill="#CBD5E1" font-size="8.5" letter-spacing="0.04em">C2D4 B1FA 3D67 7284 ADDD 2001 26D9 069A</text>

      <text x="0" y="94" fill="#64748B">UID: <tspan fill="#E2E8F0">Veera Guru Datta Srinidhi Visaka</tspan></text>
      <text x="0" y="110" fill="#64748B">ROLES: <tspan fill="#DFB76C">Edufyi • Corizo • Skill Dunia</tspan></text>
      <text x="0" y="126" fill="#64748B">ENCLAVE: <tspan fill="#CBD5E1">Vijayawada (AP, India)</tspan></text>

      <!-- Terminal Status Strip -->
      <line x1="0" y1="142" x2="300" y2="142" stroke="#26262B" stroke-width="0.8"/>
      
      <text x="0" y="162" fill="#10B981" font-weight="700" font-size="10">STATE: VERIFIED</text>
      <text x="300" y="162" fill="#DFB76C" font-size="10" text-anchor="end" font-weight="600">SOC-TIER-1</text>
    </g>
  </g>
</svg>
