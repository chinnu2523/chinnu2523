<svg width="920" height="340" viewBox="0 0 920 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Cormorant+Garamond:ital,wght@1,400;1,600&amp;family=Great+Vibes&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .cursive {
        font-family: 'Great Vibes', 'Brush Script MT', cursive;
      }
      .royal-italic {
        font-family: 'Cormorant Garamond', 'Georgia', serif;
        font-style: italic;
      }
      .monumental {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .glow-white {
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.45));
      }
      .glow-soft {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25));
      }
    </style>

    <!-- Pitch Black / Obsidian Void (Portfolio Theme) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Liquid Platinum Monolithic Text Gradient -->
    <linearGradient id="platinumTextGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Stat Text Gradient (Pure White to Silver) -->
    <linearGradient id="statGrad" x1="0" y1="0" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Ambient Studio Spotlight (Centered Halo) -->
    <radialGradient id="studioSpotlight" cx="480" cy="170" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Cyber Matrix Pattern -->
    <pattern id="matrixGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>

    <!-- Hairline Silver Border -->
    <linearGradient id="silverBorder" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Base Jet Black Canvas -->
  <rect width="920" height="340" rx="12" fill="url(#bgGrad)"/>
  <rect width="920" height="340" rx="12" fill="url(#matrixGrid)"/>
  <rect width="920" height="340" rx="12" fill="url(#studioSpotlight)"/>

  <!-- Top Specular Platinum Beam -->
  <line x1="30" y1="1" x2="890" y2="1" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Outer Precision Hairline Borders -->
  <rect x="1" y="1" width="918" height="338" rx="11" stroke="url(#silverBorder)" stroke-width="1" fill="none"/>
  <rect x="6" y="6" width="908" height="328" rx="8" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.08" fill="none"/>

  <!-- Corner Precision Crosshairs -->
  <g stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.75">
    <path d="M 14 22 L 14 14 L 22 14"/>
    <path d="M 898 14 L 906 14 L 906 22"/>
    <path d="M 14 318 L 14 326 L 22 326"/>
    <path d="M 906 318 L 906 326 L 898 326"/>
  </g>

  <!-- CENTER ORBITAL CYBERNETIC RINGS (Exact Portfolio Motif) -->
  <g transform="translate(470, 170)" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="0.8" fill="none">
    <circle cx="0" cy="0" r="50"/>
    <circle cx="0" cy="0" r="95" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="145"/>
    <circle cx="0" cy="0" r="195" stroke-dasharray="2 4"/>

    <!-- Orbital Node Indicators -->
    <circle cx="0" cy="-50" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
    <circle cx="95" cy="0" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
    <circle cx="-145" cy="0" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
    <circle cx="0" cy="195" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
  </g>

  <!-- FLOATING HUD CAPSULES (Portfolio Style) -->
  <g class="mono" font-size="9" fill="#FFFFFF">
    <!-- 8.7 CGPA KL UNIV (Top Center) -->
    <g transform="translate(416, 22)">
      <rect width="138" height="22" rx="11" fill="#0A0B10" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.25"/>
      <circle cx="14" cy="11" r="2.5" fill="#FFFFFF"/>
      <text x="24" y="14.5" fill="#FFFFFF" font-weight="600" letter-spacing="0.06em">8.7 CGPA <tspan fill="#94A3B8">KL UNIV</tspan></text>
    </g>

    <!-- ED25519 VERIFIED (Bottom Center) -->
    <g transform="translate(414, 296)">
      <rect width="144" height="22" rx="11" fill="#0A0B10" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.25"/>
      <circle cx="14" cy="11" r="2.5" fill="#FFFFFF"/>
      <text x="24" y="14.5" fill="#FFFFFF" font-weight="600" letter-spacing="0.06em">ED25519 VERIFIED</text>
    </g>
  </g>

  <!-- ================= LEFT WING (EXACT PORTFOLIO HERO) ================= -->
  <g transform="translate(32, 44)">
    <!-- Whisper-Thin Clearance Kicker -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="3" fill="#FFFFFF" class="glow-soft"/>
      <text x="16" y="9" class="mono" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.24em">
        OFFENSIVE CYBERSECURITY ARCHITECT
      </text>
    </g>

    <!-- Stacked Monolithic Headline: I'm VISAKA (Refined Proportional Styling) -->
    <g transform="translate(0, 40)">
      <!-- Cursive "I" + Royal Italic "'m" -->
      <text x="0" y="0" class="cursive glow-white" font-size="28" fill="#FFFFFF">I</text>
      <text x="14" y="-6" class="royal-italic" font-size="18" fill="#94A3B8">'m</text>

      <!-- Proportional Monolithic VISAKA in Cinzel -->
      <text x="44" y="1" class="monumental glow-white" font-size="32" font-weight="800" fill="url(#platinumTextGrad)" letter-spacing="0.08em">
        VISAKA
      </text>
    </g>

    <!-- Subtitle & Role -->
    <g transform="translate(2, 74)">
      <text x="0" y="0" class="mono" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.12em">
        LEAD PENETRATION TESTER &amp; MULTI-CLOUD SPECIALIST
      </text>
      <text x="0" y="17" class="monumental" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="0.22em">
        VEERA GURU DATTA SRINIDHI VISAKA
      </text>
    </g>

    <!-- Narrative Paragraph -->
    <g transform="translate(2, 118)" class="sans" font-size="11" fill="#94A3B8" letter-spacing="0.01em">
      <text x="0" y="0">Architecting resilient zero-trust enclaves and executing preemptive adversarial</text>
      <text x="0" y="16">simulations across critical multi-cloud infrastructures. KL University BCA</text>
      <text x="0" y="32">scholar (8.7 CGPA) with verified field engagements at Edufyi, Corizo &amp; Skill Dunia.</text>
    </g>

    <!-- Executive Action Buttons (Portfolio Exact Triplets) -->
    <g transform="translate(2, 196)" class="mono" font-size="10">
      <!-- Button 1: Solid White Pill (Explore Projects) -->
      <g>
        <rect width="154" height="30" rx="15" fill="#FFFFFF" class="glow-soft"/>
        <text x="70" y="19" fill="#000000" font-weight="800" letter-spacing="0.06em" text-anchor="middle">EXPLORE PROJECTS</text>
        <text x="138" y="19" fill="#000000" font-weight="800">&gt;</text>
      </g>

      <!-- Button 2: Dark Glass Pill (>_ CLI) -->
      <g transform="translate(164, 0)">
        <rect width="84" height="30" rx="15" fill="#0A0B10" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3"/>
        <text x="42" y="19" fill="#FFFFFF" font-weight="600" letter-spacing="0.06em" text-anchor="middle">&gt;_ CLI</text>
      </g>

      <!-- Button 3: Dark Glass Pill (RESUME) -->
      <g transform="translate(258, 0)">
        <rect width="98" height="30" rx="15" fill="#0A0B10" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3"/>
        <text x="49" y="19" fill="#FFFFFF" font-weight="600" letter-spacing="0.06em" text-anchor="middle">RESUME</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT WING (EXACT PORTFOLIO DOSSIER STATS) ================= -->
  <g transform="translate(610, 36)">
    <!-- Metric 1: Academic Merit -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.18em">01 / ACADEMIC MERIT</text>
      <text x="0" y="38" class="monumental glow-white" font-size="28" font-weight="900" fill="url(#statGrad)">8.7 CGPA</text>
      <text x="0" y="54" class="sans" font-size="10.5" fill="#64748B">KL University — BCA Scholar (Distinction)</text>
    </g>

    <!-- Hairline Separator -->
    <line x1="0" y1="68" x2="276" y2="68" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.1"/>

    <!-- Metric 2: Field Engagements -->
    <g transform="translate(0, 82)">
      <text x="0" y="10" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.18em">02 / FIELD ENGAGEMENTS</text>
      <text x="0" y="38" class="monumental glow-white" font-size="28" font-weight="900" fill="url(#statGrad)">3 ROLES</text>
      <text x="0" y="54" class="sans" font-size="10.5" fill="#64748B">Edufyi • Corizo • Skill Dunia</text>
    </g>

    <!-- Hairline Separator -->
    <line x1="0" y1="150" x2="276" y2="150" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.1"/>

    <!-- Metric 3: Defense Certifications -->
    <g transform="translate(0, 164)">
      <text x="0" y="10" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.18em">03 / DEFENSE CERTIFICATIONS</text>
      <text x="0" y="38" class="monumental glow-white" font-size="28" font-weight="900" fill="url(#statGrad)">11+ BADGES</text>
      <text x="0" y="54" class="sans" font-size="10.5" fill="#64748B">Aviatrix ACE • Google Cybersecurity</text>
    </g>

    <!-- Bottom Command Base Capsule -->
    <g transform="translate(0, 236)">
      <rect width="276" height="24" rx="12" fill="#0A0B10" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.25"/>
      <circle cx="14" cy="12" r="3" fill="#FFFFFF"/>
      <text x="24" y="16" class="mono" font-size="9" fill="#FFFFFF" letter-spacing="0.06em">
        VIJAYAWADA, INDIA // TIER-1 SOC READY
      </text>
    </g>
  </g>
</svg>
