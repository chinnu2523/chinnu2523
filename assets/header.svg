<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Great+Vibes&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap');
      .cursive {
        font-family: 'Great Vibes', 'Brush Script MT', cursive;
        font-style: italic;
      }
      .monumental {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        letter-spacing: 0.22em;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .glow-gold {
        filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
      }
      .glow-cyan {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
      }
      .glow-white {
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.35));
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040609"/>
      <stop offset="45%" stop-color="#090e1b"/>
      <stop offset="75%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>

    <radialGradient id="goldGlow" cx="240" cy="80" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#AA7C11" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#040609" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="740" cy="240" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#040609" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="silverText" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Radar Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.32"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="320" rx="16" fill="url(#grid)"/>
  
  <!-- Radial Glow Blooms -->
  <rect width="900" height="320" rx="16" fill="url(#goldGlow)"/>
  <rect width="900" height="320" rx="16" fill="url(#cyanGlow)"/>

  <!-- Radar Telemetry Rings -->
  <g opacity="0.16" stroke="#38BDF8" stroke-width="0.8" fill="none">
    <circle cx="780" cy="160" r="45"/>
    <circle cx="780" cy="160" r="95" stroke-dasharray="4 6"/>
    <circle cx="780" cy="160" r="145"/>
    <circle cx="780" cy="160" r="195" stroke-dasharray="2 4"/>
    <line x1="620" y1="160" x2="900" y2="160" stroke-dasharray="3 3"/>
    <line x1="780" y1="0" x2="780" y2="320" stroke-dasharray="3 3"/>
  </g>

  <!-- Precision Borders -->
  <rect x="1.5" y="1.5" width="897" height="317" rx="14.5" stroke="url(#borderGrad)" stroke-width="1.2" fill="none"/>
  <rect x="8" y="8" width="884" height="304" rx="10" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5" fill="none"/>

  <!-- Corner Precision Reticles & Coordinates -->
  <g stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.85">
    <!-- Top-Left -->
    <path d="M 16 28 L 16 16 L 28 16"/>
    <!-- Top-Right -->
    <path d="M 872 16 L 884 16 L 884 28"/>
    <!-- Bottom-Left -->
    <path d="M 16 292 L 16 304 L 28 304"/>
    <!-- Bottom-Right -->
    <path d="M 872 304 L 884 304 L 884 292"/>
  </g>

  <!-- Micro Coordinate Ticks -->
  <text x="36" y="32" fill="#475569" font-size="8.5" class="mono">SYS // 0x7F.SEC</text>
  <text x="864" y="32" text-anchor="end" fill="#475569" font-size="8.5" class="mono">RECON // 443.TLS</text>
  <text x="36" y="296" fill="#475569" font-size="8.5" class="mono">NODE // ZERO-TRUST</text>
  <text x="864" y="296" text-anchor="end" fill="#475569" font-size="8.5" class="mono">STATUS // ENCLAVE.ACTIVE</text>

  <!-- Top Metadata / Classification Bar -->
  <g transform="translate(450, 48)" text-anchor="middle">
    <rect x="-240" y="-13" width="480" height="26" rx="13" fill="#070C18" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.45"/>
    <circle cx="-205" cy="0" r="3.5" fill="#10B981" class="glow-cyan"/>
    <text x="10" y="4" fill="#D4AF37" font-size="10.5" font-weight="700" class="mono glow-gold">
      SOVEREIGN CYBER COMMAND // ZERO-TRUST ARCHITECTURE
    </text>
  </g>

  <!-- Main Monolithic Headline -->
  <g transform="translate(450, 142)" text-anchor="middle">
    <!-- Cursive Italic "I'm" -->
    <text x="-160" y="0" font-size="66" fill="#FFFFFF" class="cursive glow-white" transform="rotate(-6 -160 0)">
      I'm
    </text>
    
    <!-- Bold Monumental "VISAKA" -->
    <text x="45" y="0" font-size="58" fill="url(#silverText)" class="monumental glow-white">
      VISAKA
    </text>
  </g>

  <!-- Full Formal Name -->
  <text x="450" y="178" text-anchor="middle" fill="#94A3B8" font-size="11.5" font-weight="600" class="mono" letter-spacing="0.28em">
    VEERA GURU DATTA SRINIDHI VISAKA
  </text>

  <!-- Strategic Tagline -->
  <text x="450" y="210" text-anchor="middle" fill="#E2E8F0" font-size="13.5" font-weight="600" class="sans">
    <tspan fill="#38BDF8">Lead Penetration Tester</tspan>
    <tspan fill="#475569">  •  </tspan>
    <tspan fill="#F59E0B">Multi-Cloud Security Architect</tspan>
    <tspan fill="#475569">  •  </tspan>
    <tspan fill="#10B981">Threat Intelligence Analyst</tspan>
  </text>

  <!-- Bottom Metric Badges / Seals -->
  <g transform="translate(450, 262)">
    <!-- Badge 1: KL Univ -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="-13" width="150" height="26" rx="6" fill="#070C18" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="-13" width="3" height="26" rx="1.5" fill="#D4AF37"/>
      <text x="75" y="4" text-anchor="middle" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono">
        🎓 8.7 CGPA SCHOLAR
      </text>
    </g>

    <!-- Badge 2: Aviatrix -->
    <g transform="translate(-155, 0)">
      <rect x="0" y="-13" width="150" height="26" rx="6" fill="#070C18" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="-13" width="3" height="26" rx="1.5" fill="#38BDF8"/>
      <text x="75" y="4" text-anchor="middle" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono">
        ☁️ AVIATRIX ACE
      </text>
    </g>

    <!-- Badge 3: 3+ Internships -->
    <g transform="translate(10, 0)">
      <rect x="0" y="-13" width="150" height="26" rx="6" fill="#070C18" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="-13" width="3" height="26" rx="1.5" fill="#10B981"/>
      <text x="75" y="4" text-anchor="middle" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono">
        🛡️ 3+ FIELD ROLES
      </text>
    </g>

    <!-- Badge 4: Tier-1 SOC -->
    <g transform="translate(175, 0)">
      <rect x="0" y="-13" width="145" height="26" rx="6" fill="#070C18" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="-13" width="3" height="26" rx="1.5" fill="#F59E0B"/>
      <text x="72" y="4" text-anchor="middle" fill="#E2E8F0" font-size="9.5" font-weight="600" class="mono">
        ⚡ TIER-1 SOC READY
      </text>
    </g>
  </g>
</svg>
