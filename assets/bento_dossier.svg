<svg width="920" height="260" viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .monumental {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .glow-white {
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.35));
      }
    </style>

    <!-- Obsidian Card Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="60%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Liquid Platinum Filament -->
    <linearGradient id="platinumFilament" x1="0" y1="0" x2="206" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Liquid Silver Stat Gradient -->
    <linearGradient id="statGrad" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- CARD 1: ACADEMIC MERIT -->
  <g transform="translate(24, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#platinumFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#94A3B8" font-weight="600" letter-spacing="0.1em">01 / ACADEMIA</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">KL_UNIV</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-white" font-size="34" font-weight="900" fill="url(#statGrad)">8.7</text>
      <text x="70" y="-8" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">CGPA</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      BCA Scholar with
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">
      Distinction Honors
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Specialized in cryptographic
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      frameworks, network intrusion
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      heuristics &amp; multi-cloud telemetry.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.08"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">CONFERRED:</text>
      <text x="192" y="202" fill="#FFFFFF" text-anchor="end" font-weight="600">HONORS 8.7</text>
    </g>
  </g>

  <!-- CARD 2: FIELD ENGAGEMENTS -->
  <g transform="translate(246, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#platinumFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#94A3B8" font-weight="600" letter-spacing="0.1em">02 / OPERATIONS</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">DEFENSE</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-white" font-size="34" font-weight="900" fill="url(#statGrad)">03</text>
      <text x="54" y="-8" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">ROLES</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      Proven Field
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">
      Engagements
    </text>

    <!-- Bullets -->
    <g class="sans" font-size="10" fill="#E2E8F0">
      <circle cx="18" cy="132" r="2" fill="#FFFFFF"/>
      <text x="26" y="135">Edufyi Tech (Lead PenTester)</text>

      <circle cx="18" cy="148" r="2" fill="#CBD5E1"/>
      <text x="26" y="151">Corizo (Cloud Security Fellow)</text>

      <circle cx="18" cy="164" r="2" fill="#94A3B8"/>
      <text x="26" y="167">Skill Dunia (Defense Specialist)</text>
    </g>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.08"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">AUDIT STATUS:</text>
      <text x="192" y="202" fill="#FFFFFF" text-anchor="end" font-weight="600">100% DEFENDED</text>
    </g>
  </g>

  <!-- CARD 3: ACCREDITATIONS -->
  <g transform="translate(468, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#platinumFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#94A3B8" font-weight="600" letter-spacing="0.1em">03 / CLEARANCES</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">CERTS</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-white" font-size="34" font-weight="900" fill="url(#statGrad)">11+</text>
      <text x="66" y="-8" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">BADGES</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      Industry Verified
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">
      Certifications
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Aviatrix ACE Multicloud Associate,
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      Google Cybersecurity Pro, ISC2,
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      TATA &amp; Deloitte Threat Sims.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.08"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">AVIATRIX ACE:</text>
      <text x="192" y="202" fill="#FFFFFF" text-anchor="end" font-weight="600">VERIFIED_ID</text>
    </g>
  </g>

  <!-- CARD 4: SOVEREIGN ENCLAVE -->
  <g transform="translate(690, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#platinumFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#94A3B8" font-weight="600" letter-spacing="0.1em">04 / PERIMETER</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">ENCLAVE</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-white" font-size="34" font-weight="900" fill="url(#statGrad)">IN</text>
      <text x="50" y="-8" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">ENCLAVE</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      Vijayawada Enclave
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">
      Command Base
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Multi-region zero-trust ingress/egress.
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      Hardened against adversary
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      interception &amp; packet tampering.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.08"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">COORDINATES:</text>
      <text x="192" y="202" fill="#FFFFFF" text-anchor="end" font-weight="600">16.50°N 80.64°E</text>
    </g>
  </g>
</svg>
