<svg width="920" height="260" viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .monumental {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .glow-gold {
        filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
      }
      .glow-cyan {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
      }
    </style>

    <!-- Portfolio Card Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E101A"/>
      <stop offset="60%" stop-color="#0A0B12"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Royal Gold Filament -->
    <linearGradient id="goldFilament" x1="0" y1="0" x2="206" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFF2B2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyber Sky Filament -->
    <linearGradient id="cyanFilament" x1="0" y1="0" x2="206" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Royal Gold Stat Gradient -->
    <linearGradient id="goldStat" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF2B2"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Cyber Sky Stat Gradient -->
    <linearGradient id="cyanStat" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- CARD 1: ACADEMIC MERIT (ROYAL GOLD) -->
  <g transform="translate(24, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#goldFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#D4AF37" font-weight="600">[ 01.ACADEMIA ]</text>
      <text x="192" y="24" fill="#94A3B8" text-anchor="end">KL_UNIV</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-gold" font-size="34" font-weight="800" fill="url(#goldStat)">8.7</text>
      <text x="70" y="-8" class="mono" font-size="11" font-weight="600" fill="#FFF2B2">CGPA</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      BCA Scholar with
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#D4AF37">
      Distinction Honors
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Specialized in cryptographic
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      frameworks, network intrusion
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      heuristics &amp; multi-cloud telemetry.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1E293B" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">CONFERRED:</text>
      <text x="192" y="202" fill="#FFF2B2" text-anchor="end" font-weight="600">HONORS 8.7</text>
    </g>
  </g>

  <!-- CARD 2: FIELD ENGAGEMENTS (LIQUID WHITE / BLUE) -->
  <g transform="translate(246, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#cyanFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#38BDF8" font-weight="600">[ 02.OPERATIONS ]</text>
      <text x="192" y="24" fill="#94A3B8" text-anchor="end">DEFENSE</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-white" font-size="34" font-weight="800" fill="#FFFFFF">03</text>
      <text x="54" y="-8" class="mono" font-size="11" font-weight="600" fill="#38BDF8">THEATERS</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      Proven Field
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#38BDF8">
      Engagements
    </text>

    <!-- Bullets -->
    <g class="sans" font-size="10" fill="#E2E8F0">
      <circle cx="18" cy="132" r="2" fill="#38BDF8"/>
      <text x="26" y="135">Edufyi Tech (Lead PenTester)</text>

      <circle cx="18" cy="148" r="2" fill="#D4AF37"/>
      <text x="26" y="151">Corizo (Cloud Security Fellow)</text>

      <circle cx="18" cy="164" r="2" fill="#94A3B8"/>
      <text x="26" y="167">Skill Dunia (Defense Specialist)</text>
    </g>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1E293B" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">AUDIT STATUS:</text>
      <text x="192" y="202" fill="#10B981" text-anchor="end" font-weight="600">100% DEFENDED</text>
    </g>
  </g>

  <!-- CARD 3: ACCREDITATIONS (CYBER SKY / GOLD) -->
  <g transform="translate(468, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#goldFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#D4AF37" font-weight="600">[ 03.CLEARANCES ]</text>
      <text x="192" y="24" fill="#94A3B8" text-anchor="end">CERTS</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-cyan" font-size="34" font-weight="800" fill="url(#cyanStat)">11+</text>
      <text x="66" y="-8" class="mono" font-size="11" font-weight="600" fill="#38BDF8">ACCREDITED</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      Industry Verified
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#D4AF37">
      Certifications
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Aviatrix ACE Multicloud Associate,
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      Google Cybersecurity Pro, ISC2,
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      TATA &amp; Deloitte Threat Sims.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1E293B" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">AVIATRIX ACE:</text>
      <text x="192" y="202" fill="#38BDF8" text-anchor="end" font-weight="600">VERIFIED_ID</text>
    </g>
  </g>

  <!-- CARD 4: SOVEREIGN ENCLAVE (EMERALD / WHITE) -->
  <g transform="translate(690, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#goldFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#10B981" font-weight="600">[ 04.GEO_PERIMETER ]</text>
      <text x="192" y="24" fill="#94A3B8" text-anchor="end">ENCLAVE</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental glow-white" font-size="34" font-weight="800" fill="#FFFFFF">IN</text>
      <text x="50" y="-8" class="mono" font-size="11" font-weight="600" fill="#10B981">SOVEREIGN</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">
      Vijayawada Enclave
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#10B981">
      Command Base
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Multi-region zero-trust ingress/egress.
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      Hardened against adversary
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      interception &amp; packet tampering.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1E293B" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">COORDINATES:</text>
      <text x="192" y="202" fill="#D4AF37" text-anchor="end" font-weight="600">16.50°N 80.64°E</text>
    </g>
  </g>
</svg>
