<svg width="920" height="260" viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .monumental {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .card-glow {
        filter: drop-shadow(0 0 8px rgba(223, 183, 108, 0.12));
      }
    </style>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D11"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>

    <linearGradient id="goldFilament" x1="0" y1="0" x2="206" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFB76C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#DFB76C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#DFB76C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldStat" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FBD388"/>
      <stop offset="100%" stop-color="#DFB76C"/>
    </linearGradient>
  </defs>

  <!-- CARD 1: ACADEMIC DISTINCTION -->
  <g transform="translate(24, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#26262B" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#goldFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#DFB76C" font-weight="600">[ 01.ACADEMIA ]</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">KL_UNIV</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental" font-size="34" font-weight="700" fill="url(#goldStat)">8.7</text>
      <text x="70" y="-8" class="mono" font-size="11" font-weight="600" fill="#94A3B8">CGPA</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#F1F5F9">
      BCA Scholar with
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#DFB76C">
      Distinction Honors
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Specialized in cryptographic
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      frameworks, network intrusion
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      heuristics &amp; multi-cloud telemetry.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1F1F24" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">CONFERRED:</text>
      <text x="192" y="202" fill="#DFB76C" text-anchor="end" font-weight="600">HONORS 8.7</text>
    </g>
  </g>

  <!-- CARD 2: FIELD ENGAGEMENTS -->
  <g transform="translate(246, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#26262B" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#goldFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#DFB76C" font-weight="600">[ 02.OPERATIONS ]</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">MESH</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental" font-size="34" font-weight="700" fill="#FFFFFF">03</text>
      <text x="54" y="-8" class="mono" font-size="11" font-weight="600" fill="#94A3B8">THEATERS</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#F1F5F9">
      Proven Field
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#DFB76C">
      Engagements
    </text>

    <!-- Bullets -->
    <g class="sans" font-size="10" fill="#CBD5E1">
      <circle cx="18" cy="132" r="2" fill="#DFB76C"/>
      <text x="26" y="135">Edufyi Tech (Lead PenTester)</text>

      <circle cx="18" cy="148" r="2" fill="#94A3B8"/>
      <text x="26" y="151">Corizo (Cloud Security Fellow)</text>

      <circle cx="18" cy="164" r="2" fill="#94A3B8"/>
      <text x="26" y="167">Skill Dunia (Defense Specialist)</text>
    </g>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1F1F24" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">AUDIT STATUS:</text>
      <text x="192" y="202" fill="#10B981" text-anchor="end" font-weight="600">100% DEFENDED</text>
    </g>
  </g>

  <!-- CARD 3: ACCREDITATIONS -->
  <g transform="translate(468, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#26262B" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#goldFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#DFB76C" font-weight="600">[ 03.CLEARANCES ]</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">CERTS</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental" font-size="34" font-weight="700" fill="url(#goldStat)">11+</text>
      <text x="66" y="-8" class="mono" font-size="11" font-weight="600" fill="#94A3B8">ACCREDITED</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#F1F5F9">
      Industry Verified
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#DFB76C">
      Certifications
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Aviatrix ACE Multicloud Associate,
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      Google Cybersecurity Pro, ISC2,
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      TATA &amp; Deloitte Threat Sims.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1F1F24" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">AVIATRIX ACE:</text>
      <text x="192" y="202" fill="#DFB76C" text-anchor="end" font-weight="600">VERIFIED_ID</text>
    </g>
  </g>

  <!-- CARD 4: SOVEREIGN ENCLAVE -->
  <g transform="translate(690, 22)">
    <rect width="206" height="216" rx="8" fill="url(#cardGrad)" stroke="#26262B" stroke-width="1"/>
    <line x1="16" y1="1" x2="190" y2="1" stroke="url(#goldFilament)" stroke-width="1.2"/>

    <!-- Header Strip -->
    <g class="mono" font-size="8.5">
      <text x="14" y="24" fill="#DFB76C" font-weight="600">[ 04.GEO_PERIMETER ]</text>
      <text x="192" y="24" fill="#64748B" text-anchor="end">ENCLAVE</text>
    </g>

    <!-- Big Stat -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" class="monumental" font-size="34" font-weight="700" fill="#FFFFFF">IN</text>
      <text x="50" y="-8" class="mono" font-size="11" font-weight="600" fill="#94A3B8">SOVEREIGN</text>
    </g>

    <!-- Headline -->
    <text x="14" y="96" class="sans" font-size="13" font-weight="600" fill="#F1F5F9">
      Vijayawada Enclave
    </text>
    <text x="14" y="112" class="sans" font-size="13" font-weight="600" fill="#DFB76C">
      Command Base
    </text>

    <!-- Body Description -->
    <text x="14" y="136" class="sans" font-size="10" fill="#94A3B8">
      Multi-region zero-trust ingress/egress.
    </text>
    <text x="14" y="150" class="sans" font-size="10" fill="#94A3B8">
      Hardened against adversary
    </text>
    <text x="14" y="164" class="sans" font-size="10" fill="#94A3B8">
      interception &amp; packet tampering.
    </text>

    <!-- Footer Status -->
    <line x1="14" y1="184" x2="192" y2="184" stroke="#1F1F24" stroke-width="0.8"/>
    <g class="mono" font-size="8.5">
      <text x="14" y="202" fill="#64748B">COORDINATES:</text>
      <text x="192" y="202" fill="#DFB76C" text-anchor="end" font-weight="600">16.50°N 80.64°E</text>
    </g>
  </g>
</svg>
