<svg width="920" height="28" viewBox="0 0 920 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
    <linearGradient id="divLeft" x1="0" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFB76C" stop-opacity="0"/>
      <stop offset="60%" stop-color="#26262B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DFB76C" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="divRight" x1="540" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFB76C" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#26262B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DFB76C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left and Right Filament Lines -->
  <line x1="20" y1="14" x2="370" y2="14" stroke="url(#divLeft)" stroke-width="1.2"/>
  <line x1="550" y1="14" x2="900" y2="14" stroke="url(#divRight)" stroke-width="1.2"/>

  <!-- Center Telemetry Pill -->
  <g transform="translate(370, 2)">
    <rect width="180" height="24" rx="4" fill="#0A0A0D" stroke="#333338" stroke-width="0.8"/>
    <!-- Little Diamond Reticles -->
    <path d="M 12 12 L 15 9 L 18 12 L 15 15 Z" fill="#DFB76C"/>
    <text x="90" y="16" class="mono" font-size="9" fill="#E2E8F0" font-weight="600" letter-spacing="0.16em" text-anchor="middle">SOVEREIGN // SEC_OPS</text>
    <path d="M 162 12 L 165 9 L 168 12 L 165 15 Z" fill="#DFB76C"/>
  </g>
</svg>
